{% extends "base.html" %}
{% block title %}Edit User — Homework Manager{% endblock %}
{% block content %}
<h1>Edit {{ target.display_name }}</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/admin/users/{{ target.id }}/edit" class="stack">
    <label>Display name <input type="text" name="display_name" value="{{ form.display_name }}" required></label>
    <label>Username <input type="text" name="username" value="{{ form.username }}" required></label>
    <label class="checkbox"><input type="checkbox" name="is_admin" {% if form.is_admin %}checked{% endif %}> Admin</label>
    <button type="submit">Save</button>
</form>
<p><a href="/admin/users">Back to Manage users</a></p>
{% endblock %}
