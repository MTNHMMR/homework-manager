{% extends "base.html" %}
{% block title %}Settings — Homework Manager{% endblock %}
{% block content %}
<h1>My settings</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/settings" class="stack">
    <fieldset class="theme-group">
        <legend>Theme</legend>
        {% for t in themes %}
        <label class="theme-option">
            <input type="radio" name="theme" value="{{ t }}" {% if t == user.theme %}checked{% endif %}>
            {{ t.title() }}
        </label>
        {% endfor %}
    </fieldset>
    <fieldset class="accent-group">
        <legend>Accent color</legend>
        {% for a in accents %}
        <label class="accent-swatch">
            <input type="radio" name="accent_color" value="{{ a }}" class="accent-input" {% if a == user.accent_color %}checked{% endif %}>
            <span class="accent-dot accent-{{ a }}"></span>
        </label>
        {% endfor %}
    </fieldset>
    <button type="submit">Save</button>
</form>
{% endblock %}
